<style>

  #heads { position: fixed; top: 14px; left: 14px; display: flex; gap: 8px; z-index: 2; }
  #heads button { width: 46px; height: 46px; padding: 0; border-radius: 50%; border: 1.5px solid #1a1a1a; background: #f3f0e9; cursor: pointer; overflow: hidden; }
  #heads button img { width: 100%; height: 100%; display: block; }
  #heads button.on { border-color: #ff7a1a; box-shadow: 0 0 0 2.5px #ff7a1a; }
  /* on-screen controls (shown while a character is selected): keycaps like a keyboard's arrow cluster */
  .pad { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 3; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #arrows { right: calc(18px + env(safe-area-inset-right)); display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: 58px 58px; gap: 8px; }
  #arrows [data-key="ArrowUp"] { grid-column: 2; grid-row: 1; }
  #arrows [data-key="ArrowLeft"] { grid-column: 1; grid-row: 2; }
  #arrows [data-key="ArrowDown"] { grid-column: 2; grid-row: 2; }
  #arrows [data-key="ArrowRight"] { grid-column: 3; grid-row: 2; }
  #actions { left: calc(18px + env(safe-area-inset-left)); display: flex; gap: 10px; align-items: flex-end; }
  .cap { width: 58px; height: 58px; padding: 0; border: 4px solid #1a1a1a; border-radius: 14px; background: #fff; box-shadow: 0 5px 0 #1a1a1a; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: none; transition: transform 60ms, box-shadow 60ms; }
  .cap svg { width: 20px; height: 20px; display: block; }
  .cap.round { width: 70px; height: 70px; border-radius: 50%; font: 800 14px/1 -apple-system, "SF Pro Rounded", system-ui, sans-serif; letter-spacing: 0.04em; color: #1a1a1a; }
  .cap.down { transform: translateY(4px); box-shadow: 0 1px 0 #1a1a1a; background: #f3f0e9; }
  @media (max-width: 420px) {   /* phones: smaller caps so the two clusters never touch */
    #arrows { grid-template-columns: repeat(3, 50px); grid-template-rows: 50px 50px; gap: 6px; right: calc(12px + env(safe-area-inset-right)); }
    #actions { gap: 8px; left: calc(12px + env(safe-area-inset-left)); }
    .cap { width: 50px; height: 50px; border-width: 3.5px; border-radius: 12px; }

{ "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

/* ---------- renderer / scene (pattern from building-3d-widget) ---------- */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
let pixelRatio = Math.min(devicePixelRatio, 2);
renderer.setPixelRatio(pixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap; // VSM smeared into hard grey blocks at the frustum edge
renderer.shadowMap.autoUpdate = false;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#cfcdc4'); // = the ground's rendered pixel, so there's no horizon line

const camera = new THREE.PerspectiveCamera(32, 1, 0.5, 400);
camera.position.set(-22, 24, 32);
const controls = new OrbitControls(camera, canvas);
controls.target.set(1, 1.5, -1);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 120;
controls.minPolarAngle = 0.05;
controls.maxPolarAngle = 1.45;
controls.rotateSpeed = 0.7;

/* ---------- light: soft sky + one warm sun ---------- */
scene.add(new THREE.HemisphereLight(0xf2f6ff, 0xb8b29c, 1.25));
const sun = new THREE.DirectionalLight(0xfff1dc, 1.9);
sun.position.set(-18, 40, 26);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 140 });
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.02;
sun.target.position.set(1, 0, -1);
scene.add(sun, sun.target);
const groundGeo = (() => {   // 400 m plane with a hole for the pool basin (x -9.6..-6.4, z -2.3..6.6)
  const sh = new THREE.Shape([[-200, -200], [200, -200], [200, 200], [-200, 200]].map(([x, y]) => new THREE.Vector2(x, y)));
  sh.holes.push(new THREE.Path([[-9.6, 2.3], [-6.4, 2.3], [-6.4, -6.6], [-9.6, -6.6]].map(([x, y]) => new THREE.Vector2(x, y))));
  const g = new THREE.ShapeGeometry(sh); g.rotateX(-Math.PI / 2); return g; })();
const ground = new THREE.Mesh(groundGeo, new THREE.MeshLambertMaterial({ color: '#dcdccf', polygonOffset: true, polygonOffsetFactor: 6, polygonOffsetUnits: 6 }));
ground.position.y = -0.01; ground.receiveShadow = true; scene.add(ground);

/* ---------- line-model primitives ---------- */
// flat colours, one material per hex; polygonOffset keeps the edge lines on top
const COL = {
  wall: '#f3f0e9', floor: '#e7e1d5', soffit: '#a96b3e', terrace: '#ddd5c4', stone: '#d8c7a4', lawn: '#86a35e',
  coping: '#e6dfd0', water: '#5fb8a8', deck: '#4b403a', door: '#b8773f', frame: '#2a2a2c', glass: '#7d939b',
  breeze: '#55585c', paver: '#a7a298', fence: '#7a6c5a', cushion: '#ece5d6',
  play: '#c19364', rail: '#cfe6ee', tramp: '#26302f', trampRim: '#2f8f5b', sail: '#f7f1e6', slide: '#e8743b', steel: '#3b3b3d',
  trunk: '#8b7a63', palm: '#5f8b40', leaf: '#4f8a3a',
};
const mats = {};
function F(hex, extra = {}) {
  const k = hex + JSON.stringify(extra);
  return mats[k] ||= new THREE.MeshLambertMaterial({ color: hex, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1, side: THREE.DoubleSide, ...extra });
}
const FACE = F(COL.wall);
// LineBasicMaterial ignores linewidth in WebGL, so edges use screen-space fat lines (px)
const LINE = new LineMaterial({ color: 0x1a1a1a, linewidth: 1.2, transparent: true, opacity: 0.8 });
const LINE_SOFT = new LineMaterial({ color: 0x1a1a1a, linewidth: 0.8, transparent: true, opacity: 0.35 });
const model = new THREE.Group(); scene.add(model);

function solid(geo, parent = model, { cast = true, lines = LINE, angle = 20, color = COL.wall, mat } = {}) {
  const m = new THREE.Mesh(geo, mat || F(color)); m.castShadow = cast; m.receiveShadow = true; parent.add(m);
  if (lines) parent.add(new LineSegments2(new LineSegmentsGeometry().fromEdgesGeometry(new THREE.EdgesGeometry(geo, angle)), lines));
  return m;
}
// flat coloured patch on the ground (lawn, terraces, stones)
function fill(x0, x1, z0, z1, y, color, parent = model) {
  const g = new THREE.PlaneGeometry(x1 - x0, z1 - z0); g.rotateX(-Math.PI / 2); g.translate((x0 + x1) / 2, y, (z0 + z1) / 2);
  const m = new THREE.Mesh(g, F(color)); m.receiveShadow = true; parent.add(m); return m;
}
function box(x0, x1, y0, y1, z0, z1, parent, opts) {
  const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
  g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  return solid(g, parent, opts);
}
function polyline(pts, parent = model, mat = LINE, closed = false) {
  const v = pts.map(p => new THREE.Vector3(...p)); if (closed) v.push(v[0].clone());
  const g = new LineGeometry(); g.setPositions(v.flatMap(p => [p.x, p.y, p.z]));
  const l = new Line2(g, mat); l.computeLineDistances(); parent.add(l); return l;
}
const rect = (x0, x1, z0, z1, y, parent, mat) => polyline([[x0, y, z0], [x1, y, z0], [x1, y, z1], [x0, y, z1]], parent, mat, true);
// extrude a world-XZ outline upward (shape uses x, -z)
function slab(pts, y0, h, parent = model, opts) {
  const s = new THREE.Shape(pts.map(([x, z]) => new THREE.Vector2(x, -z)));
  const g = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false, curveSegments: 24 });
  g.rotateX(-Math.PI / 2); g.translate(0, y0, 0); return solid(g, parent, opts);
}
function roundCorner(pts, i, r, seg = 16) {
  const out = [], n = pts.length;
  pts.forEach((p, k) => {
    if (k !== i) { out.push(p); return; }
    const u = (a, b) => { const l = Math.hypot(b[0] - a[0], b[1] - a[1]); return [(b[0] - a[0]) / l, (b[1] - a[1]) / l]; };
    const d1 = u(p, pts[(k - 1 + n) % n]), d2 = u(p, pts[(k + 1) % n]);
    const c = [p[0] + (d1[0] + d2[0]) * r, p[1] + (d1[1] + d2[1]) * r];
    const a0 = Math.atan2(-d2[1], -d2[0]), a1 = Math.atan2(-d1[1], -d1[0]);
    let da = a0 - a1; if (da > Math.PI) da -= 2 * Math.PI; if (da < -Math.PI) da += 2 * Math.PI;
    for (let s = 0; s <= seg; s++) { const t = a1 + da * s / seg; out.push([c[0] + Math.cos(t) * r, c[1] + Math.sin(t) * r]); }
  });
  return out;
}

/* ---------- layout, metres (x east, z south), estimated from the photos ----------
   Wing A (living / kitchen / dining) x -10..6, z -10..-4
   Wing B (bedrooms)                  x 6..12,  z -10..7.7 (runs to the south boundary wall)
   Courtyard inside the L: lawn, pool on the west, deck, niche + garden door on the south wall */
const H = 3.3, SLAB = 0.6, ROOF = H + SLAB, T = 0.25;

// floors
box(-10, 6, 0, 0.15, -10, -4, model, { cast: false, color: COL.floor });
box(6, 12, 0, 0.15, -10, 7.7, model, { cast: false, color: COL.floor });
// lawn: courtyard + garden behind wing B
fill(-6.05, 4.6, -2.6, 8, 0.03, COL.lawn); fill(-10.5, -9.95, -2.6, 8, 0.03, COL.lawn); fill(-9.95, -6.05, 6.95, 8, 0.03, COL.lawn);   // lawn, cut around the pool

// walls with openings
function wallX(z, x0, x1, ops) {
  let c = x0;
  ops.forEach(([a, b]) => { if (a > c) box(c, a, 0, H, z - T / 2, z + T / 2); box(a, b, 2.55, H, z - T / 2, z + T / 2); slider('x', z, a, b); c = b; });
  if (x1 > c) box(c, x1, 0, H, z - T / 2, z + T / 2);
}
function wallZ(x, z0, z1, ops) {
  let c = z0;
  ops.forEach(([a, b]) => { if (a > c) box(x - T / 2, x + T / 2, 0, H, c, a); box(x - T / 2, x + T / 2, 2.55, H, a, b); slider('z', x, a, b); c = b; });
  if (z1 > c) box(x - T / 2, x + T / 2, 0, H, c, z1);
}
function slider(axis, at, a, b) {
  const m = (a + b) / 2, y = 2.55;
  const P = (s, h) => axis === 'x' ? [s, h, at] : [at, h, s];
  const f = 0.07, d = 0.08;
  const fr = (s0, s1, h0, h1) => axis === 'x' ? box(s0, s1, h0, h1, at - d / 2, at + d / 2, model, { color: COL.frame, lines: null }) : box(at - d / 2, at + d / 2, h0, h1, s0, s1, model, { color: COL.frame, lines: null });
  fr(a, a + f, 0.15, y); fr(b - f, b, 0.15, y); fr(m - f / 2, m + f / 2, 0.15, y); fr(a, b, y - f, y); fr(a, b, 0.15, 0.15 + f);
  const g = new THREE.PlaneGeometry(b - a - 2 * f, y - 0.15 - 2 * f);
  if (axis === 'z') g.rotateY(Math.PI / 2);
  g.translate(...P(m, (y + 0.15) / 2));
  const gl = new THREE.Mesh(g, F(COL.glass, { transparent: true, opacity: 0.75 })); model.add(gl);
}
wallX(-4, -10, 6, [[-8.7, -5.6], [-4.4, -0.3], [0.3, 4.1]]);   // courtyard face of wing A
wallX(-10, -10, 12, [[-7.8, -6.4], [-2.5, 2.5]]);              // north
wallZ(-10, -10, -4, []);                                       // west gable
wallZ(6, -4, 7.7, [[-2.4, 0.7], [3.0, 6.0]]);                  // courtyard face of wing B
wallZ(12, -10, 7.7, [[-7.3, -6.1], [-1.5, 1.5], [3.5, 5.5]]);                // east (entrance side)
wallX(7.7, 6, 12, []);                                        // south end of wing B, against the boundary wall

// roof: one L slab, overhangs into the courtyard, curved corner over the entrance
const RC = 2.6, roofPts = [[-10.6, -10.6], [12.6, -10.6]];
for (let i = 0; i <= 16; i++) { const a = i / 16 * Math.PI / 2; roofPts.push([12.6 - RC + Math.cos(a) * RC, 8.3 - RC + Math.sin(a) * RC]); }
roofPts.push([4.5, 8.3], [4.5, -2.5], [-10.6, -2.5]);
slab(roofPts, H, SLAB);
slab(roofPts, H - 0.03, 0.03, model, { color: COL.soffit, lines: null, cast: false });   // timber soffit
// stone feature corner inside the L
box(4.2, 6.0, 0.15, H, -4.16, -4.02, model, { color: COL.stone, lines: null });
box(6.12, 6.26, 0.15, H, -4.0, -2.7, model, { color: COL.stone, lines: null });

// terraces + stepping stones (flat outlines only)
fill(-10, 6, -4, -2.6, 0.06, COL.terrace); rect(-10, 6, -4, -2.6, 0.075, model, LINE_SOFT);
fill(4.6, 6, -4, 7.7, 0.06, COL.terrace); rect(4.6, 6, -4, 7.7, 0.075, model, LINE_SOFT);
for (let i = 0; i < 13; i++) { fill(-2.75, -1.95, -2.3 + i * 0.75, -1.8 + i * 0.75, 0.07, COL.coping); rect(-2.75, -1.95, -2.3 + i * 0.75, -1.8 + i * 0.75, 0.075, model, LINE_SOFT); }

// pool + deck
const P = { x0: -9.6, x1: -6.4, z0: -2.3, z1: 6.6 };
const PD = 1.4, WY = 0.02;   // basin depth, water level
box(P.x0 - 0.35, P.x1 + 0.35, 0, 0.1, P.z0 - 0.35, P.z0, model, { cast: false, color: COL.coping });   // coping strips
box(P.x0 - 0.35, P.x1 + 0.35, 0, 0.1, P.z1, P.z1 + 0.35, model, { cast: false, color: COL.coping });
box(P.x0 - 0.35, P.x0, 0, 0.1, P.z0, P.z1, model, { cast: false, color: COL.coping });
box(P.x1, P.x1 + 0.35, 0, 0.1, P.z0, P.z1, model, { cast: false, color: COL.coping });
const TILE = '#8fd0c6';
box(P.x0, P.x1, -PD - 0.1, -PD, P.z0, P.z1, model, { cast: false, color: '#7cc4b9' });                 // floor
box(P.x0, P.x0 + 0.06, -PD, 0, P.z0, P.z1, model, { cast: false, color: TILE, lines: LINE_SOFT });   // walls
box(P.x1 - 0.06, P.x1, -PD, 0, P.z0, P.z1, model, { cast: false, color: TILE, lines: LINE_SOFT });
box(P.x0, P.x1, -PD, 0, P.z0, P.z0 + 0.06, model, { cast: false, color: TILE, lines: LINE_SOFT });
box(P.x0, P.x1, -PD, 0, P.z1 - 0.06, P.z1, model, { cast: false, color: TILE, lines: LINE_SOFT });
for (let k = 1; k < 4; k++) polyline([[P.x0 + k * 0.8, -PD + 0.002, P.z0], [P.x0 + k * 0.8, -PD + 0.002, P.z1]], model, LINE_SOFT);   // lane lines
{ const g = new THREE.PlaneGeometry(P.x1 - P.x0, P.z1 - P.z0); g.rotateX(-Math.PI / 2); g.translate((P.x0 + P.x1) / 2, WY, (P.z0 + P.z1) / 2);
  const w = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: '#6fd2c8', transparent: true, opacity: 0.38, depthWrite: false })); w.renderOrder = 2; model.add(w); }
rect(P.x0, P.x1, P.z0, P.z1, 0.1, model);
box(-6.05, -3.4, 0, 0.14, -2.6, 7.6, model, { cast: false, color: COL.deck });   // deck runs up to the house terrace
for (let i = 1; i < 25; i++) polyline([[-6.05, 0.141, -2.6 + i * 0.41], [-3.4, 0.141, -2.6 + i * 0.41]], model, LINE_SOFT);

// boundary walls
box(-10.8, -10.5, 0, 2.4, -10, 8.3);
box(-10.8, 6, 0, 2.4, 8, 8.3);

// arched niche + bench at the pool's south end
(function niche() {
  const x0 = -10.2, x1 = -6.2, z0 = 7.1, z1 = 8.0, h = 2.9, cx = (x0 + x1) / 2, r = 1.35;
  const s = new THREE.Shape([new THREE.Vector2(x0, 0), new THREE.Vector2(x1, 0), new THREE.Vector2(x1, h), new THREE.Vector2(x0, h)]);
  const hole = new THREE.Path(); hole.moveTo(cx - r, 0.55); hole.lineTo(cx + r, 0.55); hole.lineTo(cx + r, 1.25);
  hole.absarc(cx, 1.25, r, 0, Math.PI, false); hole.lineTo(cx - r, 0.55); s.holes.push(hole);
  const g = new THREE.ExtrudeGeometry(s, { depth: z1 - z0, bevelEnabled: false, curveSegments: 32 }); g.translate(0, 0, z0);
  solid(g);
  box(cx - r, cx + r, 0.55, 2.6, z1 - 0.1, z1 - 0.02, model, { color: COL.stone, lines: null });
  box(cx - r, cx + r, 0, 0.55, z0 - 0.35, z1);
  box(cx - r + 0.05, cx + r - 0.05, 0.55, 0.68, z0 - 0.3, z1 - 0.12, model, { color: COL.cushion, lines: LINE_SOFT });
})();
// garden door in its box frame
box(-3.6, -1.1, 0, 2.7, 7.5, 8.33);   // door frame box, a touch proud of the wall so faces don't z-fight
box(-3.0, -1.7, 0, 2.25, 7.44, 7.5, model, { color: COL.door });   // courtyard side
box(-3.0, -1.7, 0, 2.25, 8.33, 8.38, model, { color: COL.door });   // lane side
box(-1.1, -0.6, 0, 2.7, 7.46, 8.36, model, { color: COL.stone });    // stone column beside the door frame

// entrance: breeze-block screen + carport outline
box(12.3, 12.6, 0, 2.6, -5.6, -1.8, model, { color: COL.breeze });
box(12.3, 12.7, 0, 2.6, -9.6, -8.0);
fill(12.3, 17, -10, 4, 0.02, COL.paver); rect(12.3, 17, -10, 4, 0.025, model, LINE_SOFT);

/* ---------- roof play landscape (from the top-view sketch) ----------
   jacuzzi under a round thatched roof (west), bamboo lookout tower, a woven rattan crawl tube
   winding across both roofs to the slide, which drops west onto the lawn. Stair stays at the inner corner. */
Object.assign(COL, { thatch: '#c9a66b', bamboo: '#b9945c', rattan: '#a9804a', tub: '#9a6a3e', tubWater: '#7cc6c0' });
const play = new THREE.Group(); model.add(play);
const DY = ROOF + 0.02;
function rail(x0, z0, x1, z1) {
  const len = Math.hypot(x1 - x0, z1 - z0), n = Math.max(1, Math.ceil(len / 1.5));
  for (let i = 0; i <= n; i++) { const t = i / n, x = x0 + (x1 - x0) * t, z = z0 + (z1 - z0) * t; polyline([[x, DY, z], [x, DY + 1.2, z]], play); }
  polyline([[x0, DY + 1.2, z0], [x1, DY + 1.2, z1]], play);
  const g = new THREE.PlaneGeometry(len, 1.05); g.rotateY(-Math.atan2(z1 - z0, x1 - x0)); g.translate((x0 + x1) / 2, DY + 0.62, (z0 + z1) / 2);
  play.add(new THREE.Mesh(g, F(COL.rail, { transparent: true, opacity: 0.3, depthWrite: false })));
}
